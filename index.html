<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src https: data:; connect-src 'self' https://*.supabase.co https://api.pwnedpasswords.com; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card Value</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --surface2:#faf8f3; --ink:#1c1b18; --muted:#6b675e; --line:#e4e0d6;
  --accent:#0d6e50; --accent-ink:#ffffff; --accent-soft:#e3f1ec;
  --c-everyday:#2f6fdd; --c-trips:#12a58a; --c-credits:#e0a21b; --c-bonus:#8a5cd6; --bad:#c2432f;
  --shadow:0 1px 2px rgba(30,25,10,.06),0 6px 20px rgba(30,25,10,.05);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131210; --surface:#1d1b18; --surface2:#171614; --ink:#f1eee6; --muted:#a29d90; --line:#2e2b26;
    --accent:#3fc59a; --accent-ink:#0b1b15; --accent-soft:#17302a;
    --c-everyday:#6c9cf0; --c-trips:#3fcdb0; --c-credits:#f0bb4a; --c-bonus:#b08ae8; --bad:#ef7a65;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#131210; --surface:#1d1b18; --surface2:#171614; --ink:#f1eee6; --muted:#a29d90; --line:#2e2b26;
  --accent:#3fc59a; --accent-ink:#0b1b15; --accent-soft:#17302a;
  --c-everyday:#6c9cf0; --c-trips:#3fcdb0; --c-credits:#f0bb4a; --c-bonus:#b08ae8; --bad:#ef7a65;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1760px;margin:0 auto;padding:20px 24px 120px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:clamp(26px,4vw,38px);line-height:1.05;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.layout{display:block}
/* value panel */
.panel{background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.18);position:fixed;top:0;right:0;bottom:0;width:min(410px,94vw);overflow:auto;transform:translateX(106%);transition:transform .22s ease;z-index:8}
body.panel-open .panel{transform:none}
.panelhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
.panel h2{font-size:15px;margin:0;padding:16px 18px 4px;letter-spacing:.01em}
.panel .hint{margin:0;padding:0 18px 12px;color:var(--muted);font-size:13px}
details.sec{border-top:1px solid var(--line)}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:600;display:flex;justify-content:space-between;align-items:center;min-height:48px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";color:var(--muted);font-weight:400;font-size:20px}
details.sec[open]>summary::after{content:"–"}
.sec .body{padding:0 18px 16px;display:grid;gap:14px}
.row label.t{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.row .d{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.row output{font-weight:600;color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:2px 0 0}
.field{display:grid;gap:4px;font-size:14px}
.field input[type=number]{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 10px;min-height:40px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface2);padding:10px 4px;cursor:pointer;font-size:13px;min-height:44px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
/* main */
.stacks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
@media (max-width:720px){.stacks{grid-template-columns:1fr}}
.stack{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:var(--r);padding:14px 16px}
.stack .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stack .v{font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--accent)}
.stack ul{margin:8px 0 0;padding:0;list-style:none;font-size:13.5px;display:grid;gap:3px}
.stack li b{font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;min-height:38px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 12px;min-height:38px}
.count{color:var(--muted);font-size:13px;margin-left:auto}
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.card.pinned{outline:2px solid var(--accent)}
.head{display:grid;grid-template-columns:auto auto 1fr auto;gap:14px;align-items:center}
@media (max-width:620px){.head{grid-template-columns:auto 1fr auto}.artcell{display:none}}
.rates{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.rates .rt{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:5px 9px;font-size:12.5px;line-height:1.25}
.rates .rt b{display:block;font-size:14px}
.rates .rt.hi{border-color:var(--accent);background:var(--accent-soft)}
.rank{width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.name{font-weight:650;font-size:17px;line-height:1.2}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11.5px;border-radius:999px;padding:2px 8px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.tag.good{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.warn{color:var(--bad)}
.big{text-align:right}
.big .n{font-size:28px;font-weight:750;letter-spacing:-.02em;line-height:1}
.big .n.neg{color:var(--bad)}
.big .u{font-size:12px;color:var(--muted)}
.meter{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--surface2);margin:14px 0 8px}
.meter i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--c)}
.why{margin:8px 0 0;color:var(--muted);font-size:14px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts .btn{padding:6px 12px;min-height:38px;font-size:14px}
.detail{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media (max-width:720px){.detail{grid-template-columns:1fr}}
.detail h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kv{display:grid;gap:6px;font-size:14px}
.kv div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.kv span:last-child{font-weight:600;text-align:right}
.perk{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:4px 0}
.perk input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.perk small{display:block;color:var(--muted)}
.extra{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px}
.extra input{width:90px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px;min-height:38px}
.notes{font-size:13.5px;color:var(--muted)}
/* compare tray */
.tray{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.12);padding:10px 16px;z-index:5}
.tray .in{max-width:1240px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tray .pill{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:14px}
.cmp{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:grid;place-items:center;padding:12px}
.cmp .box{background:var(--bg);border-radius:20px;max-width:1100px;width:100%;max-height:92vh;overflow:auto;padding:20px}
.cmpgrid{display:grid;gap:12px;grid-template-columns:repeat(var(--n),minmax(210px,1fr));overflow-x:auto}
.cmpcol{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.cmpcol h3{margin:0 0 4px;font-size:17px}
.foot{margin-top:28px;color:var(--muted);font-size:13px;max-width:80ch}
.foot a{color:var(--muted)}
.cmp[hidden],.tray[hidden],.wiz[hidden]{display:none}
.wiz{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:14;display:grid;place-items:center;padding:12px}
.wbox{background:var(--bg);border-radius:20px;max-width:820px;width:100%;max-height:94vh;overflow:auto;padding:22px}
.wbox .field select{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 10px;min-height:40px}
.seg2{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg2 button{border:0;background:var(--surface);padding:8px 16px;cursor:pointer;min-height:40px}
.seg2 button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 120px)}
table.sheet{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.sheet th,.sheet td{padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right;background:var(--surface)}
.sheet tbody tr:nth-child(even) td{background:var(--surface2)}
.sheet tbody tr:hover td{background:var(--accent-soft)}
.sheet th:first-child,.sheet td:first-child{position:sticky;left:0;text-align:left;z-index:1;min-width:250px;border-right:1px solid var(--line)}
.sheet thead th{position:sticky;z-index:3;background:var(--surface2);font-weight:600;cursor:pointer;user-select:none}
.sheet thead tr.grp th{top:0;cursor:default;text-align:center;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sheet thead tr.cols th{top:34px;font-size:12.5px;white-space:normal;vertical-align:bottom;line-height:1.2;min-width:70px}
.sheet thead tr.cols th:first-child{z-index:4}
.sheet thead tr.grp th:first-child{z-index:4}
.g-gives{background:color-mix(in srgb,var(--c-everyday) 14%,var(--surface)) !important}
.g-worth{background:color-mix(in srgb,var(--accent) 16%,var(--surface)) !important}
.g-facts{background:var(--surface2)}
.g-rates{background:color-mix(in srgb,var(--c-credits) 18%,var(--surface)) !important}
.sheet td small{display:block;color:var(--muted);font-size:11px}
.sheet td.rt{min-width:70px;padding:7px 8px}
.sheet td.hi{color:var(--accent);font-weight:650}
.sheet td.hi small{color:var(--accent)}
.nm{display:flex;gap:10px;align-items:center}
.art{flex:none;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.artbox{display:inline-block;position:relative;flex:none}
.artimg{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.artfb{display:none}
.artbox.noimg .artimg{display:none}
.artbox.noimg .artfb{display:block}
.sheet td.net{font-weight:750;color:var(--accent);font-size:14.5px}
.sheet td.neg{color:var(--bad)}
.sheet td.sep,.sheet th.sep{border-left:2px solid var(--line)}
.sheet td.name button{all:unset;cursor:pointer;font-weight:600}
.sheet td.name button:hover{text-decoration:underline}
.sheet td.name small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.sheet .yes{color:var(--accent);font-weight:600}
.sheet .no{color:var(--muted)}
.sheet .warn{color:var(--bad)}
.arrow{opacity:.6;margin-left:3px;font-size:10px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 14px}
@media (max-width:720px){.controls{grid-template-columns:1fr}}
.ctl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.ctl label{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14.5px;flex-wrap:wrap}
.ctl output{color:var(--accent);font-weight:650}
.ctl p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.ctl .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ctl .quick .chip{padding:4px 10px;min-height:32px;font-size:13px}
.audit li{margin:0 0 8px;font-size:13.5px}
.cform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cform .wide{grid-column:1/-1}
.clist{display:grid;gap:6px;font-size:13.5px}
.clist div{display:flex;justify-content:space-between;align-items:center;gap:8px}
.audit .ok{color:var(--accent)} .audit .warn{color:var(--c-credits)} .audit .fixed{color:var(--c-bonus)}
.audit ul{margin:0;padding-left:0;list-style:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Card Value</h1>
      <p class="sub" id="subline">Set what points, credits and perks are worth to you. Every card re-ranks instantly. Runs on your computer only; your numbers never leave this page.</p>
    </div>
    <div class="tools">
      <button class="btn primary" id="spendbtn">My spending</button>
      <button class="btn" id="authbtn" hidden>Sign in</button>
      <button class="btn" id="panelbtn">What things are worth to me</button>
      <div class="seg2" role="group" aria-label="View"><button data-view="table" aria-pressed="false">Table</button><button data-view="cards" aria-pressed="false">Cards</button></div>
      <button class="btn" id="csv">Download CSV</button>
      <button class="btn" id="reset">Reset my values</button>
      <button class="btn" id="theme">Light / dark</button>
    </div>
  </header>

  <div class="layout">
    <aside class="panel" aria-label="What things are worth to you">
      <div class="panelhead"><h2 style="padding:0">What it's worth to you</h2><button class="btn" id="panelx">Close</button></div>
      <p class="hint">Drag any slider. Defaults are cautious.</p>
      <div id="panel"></div>
    </aside>

    <main>
      <section class="stacks" id="stacks" aria-label="Best card combinations"></section>
      <section class="controls" id="controls"></section>
      <div class="bar" id="filters"></div>
      <div class="list" id="list"></div>
      <p class="foot" id="foot"></p>
    </main>
  </div>
</div>

<div class="tray" id="tray" hidden><div class="in" id="trayin"></div></div>
<div class="cmp" id="cmp" hidden></div>
<div class="wiz" id="wiz" hidden role="dialog" aria-modal="true" aria-labelledby="wiztitle"></div>
<div class="wiz" id="auth" hidden role="dialog" aria-modal="true" aria-labelledby="authtitle"></div>

<script src="data.js"></script>
<script src="my-spend.js"></script>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="auth.js"></script>
</body>
</html>
